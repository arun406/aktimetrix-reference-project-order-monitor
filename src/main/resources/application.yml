# Everything else (Kafka bindings, serializers, Jackson) has defaults in aktimetrix-core.
spring:
  application:
    name: order-process-monitor
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/order-monitor?directConnection=true}
  kafka:
    properties:
      bootstrap.servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

aktimetrix:
  events:
    topic: order-events          # where the shop publishes its business events
  time-zone: UTC                 # zone of the planned and actual times
  monitor:
    overdue-check-interval: PT1M # how often to look for steps past their planned time (ISO-8601)

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

logging:
  level:
    com.aktimetrix: INFO
