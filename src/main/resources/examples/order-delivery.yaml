# The order delivery process as a YAML definition file: the same definitions as OrderDeliveryDefinitions.java,
# which the application uses. OrderDeliveryDefinitionsTest checks that the two stay identical.
#
# To use this file instead of the Java DSL, move it to src/main/resources/aktimetrix/, delete
# OrderDeliveryDefinitions.java, and write the two planning rules (the TIME of the order and of DELIVERED) as meters:
# see "Meter" in section 9.3 of the Aktimetrix white paper.
tenant: AA
processes:
  - processCode: ORDER_DELIVERY
    processName: Order delivery
    processDescription: From the moment an order is created until it is delivered, and rated
    entityType: com.ecom.order
    status: CONFIRMED
    startEventCodes: [ORDER_CREATED_EVENT]
    cancelEventCodes: [ORDER_CANCELLED_EVENT]
    measurements:
      - { measurementCode: TIME, type: P }        # the order's deadline, planned by a rule
      - { measurementCode: COST, type: P, value: "8", unit: EUR, tolerance: 10%, worseWhen: HIGHER }
      - { measurementCode: COST, type: A, valueFrom: deliveryCost, unit: EUR }
    metrics:
      - { code: FUEL_PER_KM, expression: FUEL / DISTANCE, unit: L/KM, tolerance: 10%, worseWhen: HIGHER }
    steps:
      - stepCode: CONFIRM
        stepName: Order confirmed
        startEventCodes: [ORDER_CONFIRMED_EVENT]
        plannedWithin: PT5M

      - stepCode: PAY
        stepName: Payment confirmed
        startEventCodes: [PAYMENT_CONFIRMED_EVENT]
        plannedWithin: PT15M
        tolerance: PT5M

      - stepCode: HANDOVER
        stepName: Handed to the delivery agent
        startEventCodes: [HANDED_TO_AGENT_EVENT]
        plannedWithin: PT2H

      - stepCode: ACCEPT
        stepName: Delivery agent accepted
        startEventCodes: [AGENT_ACCEPTED_EVENT]
        plannedWithin: PT2H15M

      - stepCode: TRAVEL
        stepName: Travel to the customer
        startEventCodes: [TRAVEL_STARTED_EVENT]
        endEventCodes: [ARRIVED_EVENT]
        progressEventCodes: [LOCATION_UPDATED_EVENT]
        plannedWithin: PT3H
        measurements:
          - { measurementCode: DISTANCE, type: P, value: "5", unit: KM, tolerance: 20%, worseWhen: HIGHER }
          - { measurementCode: DISTANCE, type: A, valueFrom: route.distanceKm, unit: KM }
          - { measurementCode: FUEL, type: P, value: "0.4", unit: L, tolerance: 25%, worseWhen: HIGHER }
          - { measurementCode: FUEL, type: A, valueFrom: fuelLitres, unit: L }

      - stepCode: DELIVERED
        stepName: Delivered
        startEventCodes: [ORDER_DELIVERED_EVENT]
        measurements:
          - { measurementCode: TIME, type: P }    # planned by a rule
          - { measurementCode: TEMPERATURE, type: P, value: "30", unit: C, tolerance: "5", worseWhen: HIGHER }
          - { measurementCode: TEMPERATURE, type: A, valueFrom: parcelTemperatureC, unit: C }

      - stepCode: RATED
        stepName: Rated by the customer
        startEventCodes: [ORDER_RATED_EVENT]
        optionalInd: Y
        measurements:
          - { measurementCode: RATING, type: P, value: "5", unit: STARS, tolerance: "1", worseWhen: LOWER }
          - { measurementCode: RATING, type: A, valueFrom: review.stars, unit: STARS }
