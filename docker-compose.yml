# Local Kafka and MongoDB for the order monitor: docker compose up -d
# Both run without authentication, for development only, so they listen on this machine alone.
services:
  kafka:
    image: apache/kafka:4.2.1      # single-node KRaft broker on localhost:9092
    ports:
      - "127.0.0.1:9092:9092"
  mongo:
    image: mongo:8.0
    ports:
      - "127.0.0.1:27017:27017"
