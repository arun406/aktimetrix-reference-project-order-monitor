# Local Kafka and MongoDB for the order monitor: docker compose up -d
services:
  kafka:
    image: apache/kafka:3.7.0      # single-node KRaft broker on localhost:9092
    ports:
      - "9092:9092"
  mongo:
    image: mongo:6
    # a single-node replica set, so that Aktimetrix can write each event's state and outbound events in one transaction
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    healthcheck:
      # initiates the replica set on first start, then reports healthy once it has a primary
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) {
          rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
